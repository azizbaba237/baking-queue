{% extends 'base.html' %}
{% block title %}Ajouter un Employé{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-4 text-bank-dark-gray">Ajouter un nouvel employé</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-4">
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
            Créer l'employé
        </button>
    </form>
</div>
{% endblock %}
